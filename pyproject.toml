[project]
name = "text-to-sql"
version = "0.1.0"
description = "CS F429 Text-to-SQL project"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
text-to-sql-demo = "text_to_sql.cli:main"
text-to-sql-part2-smoke = "scripts.run_part2_smoke:main"

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
