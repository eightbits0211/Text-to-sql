[project]
name = "text-to-sql"
version = "0.1.0"
description = "CS F429 Text-to-SQL project"
requires-python = ">=3.11,<3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "torch>=2.2,<3",
]

[project.scripts]
text-to-sql-demo = "text_to_sql.cli:main"
text-to-sql-part2-smoke = "scripts.run_part2_smoke:main"

[project.optional-dependencies]
modern = [
    "accelerate>=1.15.0",
    "sentencepiece>=0.2.2",
    "transformers>=5.20.1",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
